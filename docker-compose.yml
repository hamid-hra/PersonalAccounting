name: personal-accounting

# همهٔ تنظیمات از فایل .env می‌آید؛ هیچ متغیری لازم نیست جای دیگری تعریف شود.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # فقط برای پشتیبان‌های محلی و وارد کردن فایل‌های نسخه‌های قدیمی.
      # فایل‌های آپلودشده داخل دیتابیس‌اند.
      - ./data:/data
    # فقط روی لوکال‌هاست — دادهٔ مالی نباید روی شبکه منتشر شود
    ports:
      - "127.0.0.1:8080:8000"

volumes:
  pgdata:
