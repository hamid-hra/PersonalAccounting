name: personal-accounting

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    # با کاربر میزبان اجرا می‌شود تا فایل‌های نوشته‌شده در data/ متعلق به
    # خودت باشند، نه root — وگرنه پشتیبان‌گیری و باز کردنشان ممکن نیست.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_PASSWORD: ${APP_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      DATA_DIR: /data
      MARKET_PROVIDER: ${MARKET_PROVIDER:-brsapi}
      BRSAPI_KEY: ${BRSAPI_KEY:-}
      BRSAPI_DAILY_QUOTA: ${BRSAPI_DAILY_QUOTA:-1500}
      BRSAPI_QUOTA_RESERVE: ${BRSAPI_QUOTA_RESERVE:-50}
      NAVASAN_API_KEY: ${NAVASAN_API_KEY:-}
      NAVASAN_MONTHLY_QUOTA: ${NAVASAN_MONTHLY_QUOTA:-120}
      NAVASAN_QUOTA_RESERVE: ${NAVASAN_QUOTA_RESERVE:-10}
    volumes:
      - ./data:/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # فقط روی لوکال‌هاست — دادهٔ مالی نباید روی شبکه منتشر شود
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

volumes:
  pgdata:
