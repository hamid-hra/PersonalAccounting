name: personal-accounting

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-accounting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD را در .env بگذار}
      POSTGRES_DB: ${POSTGRES_DB:-accounting}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-accounting} -d ${POSTGRES_DB:-accounting}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    # با کاربر میزبان اجرا می‌شود تا پشتیبان‌های نوشته‌شده در data/ متعلق به خودت باشند
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-accounting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-accounting}
      # اختیاری — خالی بماند، خودش می‌سازد و در دیتابیس نگه می‌دارد
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      # فقط برای پشتیبان‌های محلی و وارد کردن فایل‌های نسخه‌های قدیمی.
      # فایل‌های آپلودشده داخل دیتابیس‌اند.
      - ./data:/data
    # فقط روی لوکال‌هاست — دادهٔ مالی نباید روی شبکه منتشر شود
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8000"

volumes:
  pgdata:
